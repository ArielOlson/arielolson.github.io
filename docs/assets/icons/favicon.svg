<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ariel Olson">
  <title>Ariel Olson</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121628"/>
      <stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <!-- the city's glow rising from the bottom edge -->
    <radialGradient id="dusk" cx="0.5" cy="1.08" r="0.72">
      <stop offset="0" stop-color="#FF7FB0" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#FF7FB0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FF7FB0" stop-opacity="0"/>
    </radialGradient>
    <!-- A: rose, lit from above -->
    <linearGradient id="rose" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="51">
      <stop offset="0" stop-color="#FFD6E5"/>
      <stop offset="0.45" stop-color="#FF8DBA"/>
      <stop offset="1" stop-color="#F45C97"/>
    </linearGradient>
    <!-- O: ice, brightest at the upper right like the head of the blade line -->
    <linearGradient id="ice" gradientUnits="userSpaceOnUse" x1="57" y1="13" x2="33" y2="51">
      <stop offset="0" stop-color="#F4FDFF"/>
      <stop offset="0.38" stop-color="#9DE7F8"/>
      <stop offset="1" stop-color="#3F9CC2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="crossing"><path clip-rule="evenodd" d="M30.6 31.7a14.4 19.5 0 1 0 28.8 0a14.4 19.5 0 1 0 -28.8 0Z M37.7 31.7a7.3 15.1 0 1 0 14.6 0a7.3 15.1 0 1 0 -14.6 0Z"/></clipPath>
  </defs>

  <style>
    .hairline { stroke-width: 0; }
    @media (max-width: 32px) {
      /* at tab size the hairlines would vanish: thicken the letters, drop the glint */
      .hairline { stroke-width: 1.7; }
      .glint { display: none; }
      .knock { stroke-width: 2.6; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="64" height="64" fill="url(#tile)"/>
    <rect width="64" height="64" fill="url(#dusk)"/>

    <!-- O, a Bodoni oval: heavy at the sides, hairline at top and bottom -->
    <path class="hairline" filter="url(#glow)" fill="url(#ice)" stroke="url(#ice)" stroke-linejoin="round" fill-rule="evenodd"
          d="M31.5 31.7a13.5 18.6 0 1 0 27 0a13.5 18.6 0 1 0 -27 0Z
             M36.8 31.7a8.2 16 0 1 0 16.4 0a8.2 16 0 1 0 -16.4 0Z"/>

    <!-- the A passes in front of the O; a cut-away, clipped to the O, parts them where they cross -->
    <g class="knock" clip-path="url(#crossing)" fill="none" stroke="#0A0C17" stroke-width="3.2" stroke-linejoin="round">
      <polygon points="21.2,13 24.6,13 38.6,50 29.4,50"/>
      <polygon points="20.9,13 22.6,13 11.2,50 8.2,50"/>
      <rect x="12.6" y="37.2" width="15.4" height="2.4"/>
      <rect x="5.4" y="49.2" width="8.8" height="1.3"/>
      <rect x="26.6" y="49.2" width="14.8" height="1.3"/>
    </g>

    <!-- A, a Bodoni cut: heavy right stroke, hairline left stroke, fine serifs -->
    <g class="hairline" filter="url(#glow)" fill="url(#rose)" stroke="url(#rose)" stroke-linejoin="round">
      <polygon points="21.2,13 24.6,13 38.6,50 29.4,50"/>
      <polygon points="20.9,13 22.6,13 11.2,50 8.2,50"/>
      <rect x="12.6" y="37.2" width="15.4" height="2.4"/>
      <rect x="5.4" y="49.2" width="8.8" height="1.3"/>
      <rect x="26.6" y="49.2" width="14.8" height="1.3"/>
    </g>

    <!-- the blade's glint at the head of the O -->
    <path class="glint" filter="url(#spark)" fill="#FFFFFF"
          d="M52.7 14.5Q53.25 18.95 57.7 19.5Q53.25 20.05 52.7 24.5Q52.15 20.05 47.7 19.5Q52.15 18.95 52.7 14.5Z"/>

    <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  </g>
</svg>
