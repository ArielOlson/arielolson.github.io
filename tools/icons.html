<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Favicon workbench</title>
<style>
  :root{--ink:#F4F1F5;--mist:#A9AEBE;--line:#282D3C;--ground:#07080F;--rose:#FF7FB0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 "Schibsted Grotesk",system-ui,sans-serif;padding:32px}
  h1{font:600 20px/1.2 system-ui;margin:0 0 4px}
  p{color:var(--mist);margin:0 0 24px;max-width:70ch}
  .row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;margin-bottom:32px}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
  figcaption{font:11px/1 ui-monospace,monospace;color:var(--mist);letter-spacing:.08em}
  .hero img{width:256px;height:256px;border-radius:0}
  .tabs{display:grid;gap:14px;max-width:560px;margin-bottom:32px}
  .strip{display:flex;gap:2px;padding:8px 8px 0;border-radius:10px 10px 0 0}
  .strip.light{background:#DEE1E6}
  .strip.dark{background:#1F2023}
  .tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px 8px 0 0;width:210px;font:12px system-ui}
  .light .tab{background:#fff;color:#1F1F1F}
  .light .tab.dim{background:transparent;color:#474747}
  .dark .tab{background:#35363A;color:#E8EAED}
  .dark .tab.dim{background:transparent;color:#9AA0A6}
  .tab img{width:16px;height:16px;flex:none}
  .dot{width:16px;height:16px;border-radius:50%;background:#9AA0A6;opacity:.5;flex:none}
  button{font:12px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;padding:12px 18px;background:var(--rose);color:#200A14;border:0;cursor:pointer}
  #log{font:12px/1.7 ui-monospace,monospace;color:var(--mist);white-space:pre;margin-top:16px}
</style>
</head>
<body>
  <h1>Favicon workbench</h1>
  <p>favicon.svg is the master. Below are real-size renders as a browser would show them,
     and the button renders every PNG and the ICO from it into docs/assets/icons.</p>

  <div class="row">
    <figure class="hero"><img id="big" alt=""><figcaption>256</figcaption></figure>
  </div>

  <div class="row" id="sizes"></div>

  <div class="tabs">
    <div class="strip light">
      <div class="tab"><img class="fi" alt="">Ariel Olson</div>
      <div class="tab dim"><span class="dot"></span>Inbox</div>
    </div>
    <div class="strip dark">
      <div class="tab"><img class="fi" alt="">Ariel Olson</div>
      <div class="tab dim"><span class="dot"></span>Inbox</div>
    </div>
  </div>

  <button id="go">Render all formats</button>
  <div id="log"></div>

<script>
const SRC = '/assets/icons/favicon.svg';
const log = (m) => (document.getElementById('log').textContent += m + '\n');

async function svgText() {
  return (await fetch(SRC, { cache: 'no-store' })).text();
}

// The SVG's own media query decides the small-size cut, so it has to be
// rasterised at the target size, not drawn big and scaled down.
function sized(text, size, fullBleed) {
  let t = text.replace(/width="64" height="64"/, `width="${size}" height="${size}"`);
  if (fullBleed) {
    // iOS rounds its own corners; hand it a square
    t = t.replace('<rect width="64" height="64" rx="14"/>', '<rect width="64" height="64"/>')
         .replace(/<rect x="0\.5" y="0\.5"[^>]*\/>/, '');
  }
  return URL.createObjectURL(new Blob([t], { type: 'image/svg+xml' }));
}

async function render(text, size, fullBleed = false) {
  const url = sized(text, size, fullBleed);
  const img = new Image();
  img.src = url;
  await img.decode();
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  if (fullBleed) { ctx.fillStyle = '#0B0E1A'; ctx.fillRect(0, 0, size, size); }
  ctx.drawImage(img, 0, 0, size, size);
  URL.revokeObjectURL(url);
  return new Promise((res) => c.toBlob(res, 'image/png'));
}

function ico(pngs) {
  // ICO may carry PNG payloads directly
  const head = new DataView(new ArrayBuffer(6 + 16 * pngs.length));
  head.setUint16(2, 1, true);
  head.setUint16(4, pngs.length, true);
  let offset = 6 + 16 * pngs.length;
  pngs.forEach(({ size, bytes }, i) => {
    const o = 6 + i * 16;
    head.setUint8(o, size >= 256 ? 0 : size);
    head.setUint8(o + 1, size >= 256 ? 0 : size);
    head.setUint16(o + 4, 1, true);
    head.setUint16(o + 6, 32, true);
    head.setUint32(o + 8, bytes.byteLength, true);
    head.setUint32(o + 12, offset, true);
    offset += bytes.byteLength;
  });
  return new Blob([head.buffer, ...pngs.map((p) => p.bytes)], { type: 'image/x-icon' });
}

async function save(name, blob) {
  const r = await fetch('/__capture?name=' + name, { method: 'POST', body: blob });
  log(await r.text());
}

async function renderAll() {
  const text = await svgText();
  const small = [];
  for (const size of [16, 32, 48]) {
    const b = await render(text, size);
    small.push({ size, bytes: await b.arrayBuffer() });
    await save(`favicon-${size}.png`, b);
  }
  await save('favicon-180.png', await render(text, 180, true));
  await save('favicon-512.png', await render(text, 512));
  await save('favicon.ico', ico(small));
  log('done');
  return 'done';
}
window.renderAll = renderAll;

(async function preview() {
  const text = await svgText();
  document.getElementById('big').src = sized(text, 256);
  const row = document.getElementById('sizes');
  for (const s of [16, 24, 32, 48, 64, 128]) {
    const f = document.createElement('figure');
    const i = new Image(s, s);
    i.src = sized(text, s);
    f.append(i);
    const cap = document.createElement('figcaption');
    cap.textContent = s;
    f.append(cap);
    row.append(f);
  }
  document.querySelectorAll('.fi').forEach((i) => (i.src = sized(text, 16)));
})();

document.getElementById('go').onclick = renderAll;
</script>
</body>
</html>
